<style>
/* content2html design owner. Screen, presentation and print share these roles.
 * Keep this plain CSS: the standalone GitHub Pages 404 embeds it verbatim.
 * Tailwind aliases live in global.css; consumers must not fork these values. */
:root {
  --site-design-system: content2html-20261120;
  --type-font-sans: 'Helvetica Neue', 'Inter', system-ui, -apple-system, sans-serif;
  --type-font-serif: 'Times New Roman', 'Noto Serif SC', Georgia, serif;
  --type-font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  --type-root: 16px;
  --type-prose: 1rem;
  --type-display: 5rem;
  --type-headline: 3.5rem;
  --type-title: 2rem;
  --type-subheading: 1.25rem;
  --type-body: 1.125rem;
  --type-caption: .9375rem;
  --type-kicker: .8125rem;
  --type-ui: .875rem;
  --type-ui-badge: .6875rem;
  --type-control: .8rem;
  --type-control-button: .9rem;
  --type-control-label: .72rem;
  --type-control-zoom: .78rem;
  --type-control-print: .75rem;
  --type-meta-label: .7rem;
  --type-detail: .85rem;
  --type-bullet-title: 1.5rem;
  --type-formula-inline: 1.1rem;
  --type-formula-display: 1.8rem;
  --type-formula-label: .95rem;
  --type-message-title: 4rem;
  --leading-flat: 1;
  --leading-slide-heading: 1.15;
  --leading-kicker: 1.2;
  --leading-title: 1.25;
  --leading-label: 1.3;
  --leading-bullet: 1.35;
  --leading-caption: 1.4;
  --leading-detail: 1.45;
  --leading-body: 1.5;
  --leading-readable: 1.625;
  --leading-prose: 1.75;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --tracking-heading: -.02em;
  --tracking-title: -.01em;
  --tracking-body: 0;
  --tracking-prose: .005em;
  --tracking-caption: .01em;
  --tracking-wide: .05em;
  --tracking-page: .08em;
  --tracking-meta: .1em;
  --tracking-kicker: .12em;
  /* Four-pixel screen step; all ordinary spacing and Tailwind n-units use it. */
  --space-unit: .25rem;
  --space-grid: var(--space-unit); /* Tailwind spacing adapter; print retains its historical em variant. */
  --space-baseline: calc(var(--space-unit) * 2);
  --space-prose-block: calc(var(--space-unit) * 8);
  --space-prose-inline: calc(var(--space-unit) * 6);
  --space-heading-before: calc(var(--space-unit) * 10);
  --space-heading-after: calc(var(--space-unit) * 4);
  --space-message-margin: calc(var(--space-unit) * 16);
  --space-character: 1ch;
  --measure-reading: 45rem;
  --measure-message: 32rem;
  --measure-slide-heading: 64rem;
  --measure-slide-title: 72rem;
  --measure-slide-body: 80rem;
  /* Section body measure: the full slide content width (1920 − 100×2 inline padding).
     A section body carries the paper's whole outline, so it spans the canvas
     instead of the narrower reading measure used for headings and titles. */
  --measure-slide-section: 107.5rem;
  --measure-zoom-label: 2.8rem;
  --measure-control: 2rem;
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-scale: 1; /* Runtime view scale only; never the print scale. */
  --slide-frame-pad: 80px;
  --slide-space-block: 80px;
  --slide-space-inline: 100px;
  --slide-meta-bottom: 32px;
  --slide-info-bottom: 90px;

  --measure-slide-info: 420px;
  --slide-info-column-gap: 14px;
  --slide-info-row-gap: 6px;
  --slide-info-rank-gap: 4px;
  --print-root: 9.37px;
  --print-width: 297mm;
  --print-height: 167mm;
  --print-space-block: 35px;
  --print-space-inline: 40px;
  --print-gap: 14px;
  --print-meta-bottom: 19px;
  --print-meta-side: 58px;
  --print-info-bottom: 53px;
  --print-info-left: 33px;
  --print-measure-info: 246px;
}
@media print {
  /* Preserve the established 9.37px rem + per-slide em print contract. */
  .slide-page {
    --type-display: 5em;
    --type-headline: 3.5em;
    --type-title: 2em;
    --type-body: 1.125em;
    --type-caption: .9375em;
    --type-kicker: .8125em;
    --space-grid: .25em;
    --space-baseline: .5em;
  }
}

html[data-page-role="message"], html[data-page-role="redirect"] { font-size: var(--type-root); }
/* Message pages share this owner, including the independently served 404. */
.message-page {
  margin: 0;
  padding: var(--space-prose-inline);
  font-family: var(--type-font-sans);
  font-size: var(--type-prose);
  line-height: var(--leading-body);
  font-weight: var(--weight-normal);
  letter-spacing: var(--tracking-body);
  color: #0a0a0a;
  background: #fff;
}
.message-page, .message-page * { box-sizing: border-box; }
.message {
  max-width: var(--measure-message);
  margin: var(--space-message-margin) auto;
  padding: var(--space-prose-inline);
  text-align: center;
  overflow-wrap: anywhere;
}
.message h1 {
  font-family: var(--type-font-sans);
  font-size: var(--type-message-title);
  font-weight: var(--weight-bold);
  line-height: var(--leading-title);
  letter-spacing: var(--tracking-heading);
  margin: 0 0 var(--space-heading-after);
  color: #002fa7;
}
.message p { margin: 0 0 var(--space-prose-inline); }
.message a {
  display: inline-block;
  padding: calc(var(--space-unit) * 2.4) var(--space-prose-inline);
  background: #002fa7;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-weight: var(--weight-semibold);
}
.message a:hover { background: #001a5c; }
.message .lang-switch { margin-top: var(--space-heading-after); font-size: var(--type-ui); }
.message .lang-switch a { background: transparent; color: #002fa7; padding: var(--space-unit) calc(var(--space-unit) * 2); }
</style>
<!-- END SHARED MESSAGE STYLES -->
</head>
<body class="message-page">
  <main class="message" id="main">
    <h1>404</h1>
    <p>抱歉，访问的页面不存在。</p>
    <p><a href="/content2html/zh/">返回首页</a></p>
    <p class="lang-switch">English: <a href="/content2html/en/404/">404</a></p>
  </main>

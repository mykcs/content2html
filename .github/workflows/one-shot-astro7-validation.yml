name: One-shot Astro 7 deep validation

on:
  push:
    branches:
      - agent/astro7-upgrade

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch and submodules
        uses: actions/checkout@v6
        with:
          ref: agent/astro7-upgrade
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm Astro 7 and repair non-breaking audit issues
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./node_modules/astro/package.json'); if(!p.version.startsWith('7.')) throw new Error('expected Astro 7, got '+p.version); console.log('Astro', p.version)"
          npm audit fix
          npm audit --audit-level=high

      - name: Persist audited dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Audit required no metadata change.'
          else
            git commit -m 'fix(deps): resolve post-upgrade audit finding'
            git push origin HEAD:agent/astro7-upgrade
          fi

      - name: Build upgraded dependency graph
        run: npm run build

      - name: Install repository validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep poppler-utils
          npx playwright install --with-deps chromium

      - name: Check bilingual/template consistency
        run: bash scripts/check-template-consistency.sh

      - name: Start upgraded preview server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 > /tmp/content2html-preview.log 2>&1 &
          echo $! > /tmp/content2html-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/content2html/zh/paper/2603.12109/slide/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/content2html-preview.log
          exit 1

      - name: Run print/browser regression against upgraded local build
        env:
          URL: http://127.0.0.1:4321/content2html/zh/paper/2603.12109/slide/
          SLIDE_COUNT: '16'
        run: node scripts/verify-print-e2e.mjs

      - name: Stop preview server
        if: always()
        run: |
          test ! -f /tmp/content2html-preview.pid || kill "$(cat /tmp/content2html-preview.pid)" || true
          cat /tmp/content2html-preview.log || true

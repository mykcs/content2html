name: One-shot Astro 7 upgrade

on:
  push:
    branches:
      - agent/astro7-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch and submodules
        uses: actions/checkout@v6
        with:
          ref: agent/astro7-upgrade
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Astro and official integrations
        run: npx --yes @astrojs/upgrade --yes

      - name: Verify upgraded project
        run: npm run build

      - name: Commit resolved package metadata
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No package metadata changes produced by the upgrade tool.' >&2
            exit 1
          fi
          git commit -m 'chore(deps): upgrade Astro to v7'
          git push origin HEAD:agent/astro7-upgrade
